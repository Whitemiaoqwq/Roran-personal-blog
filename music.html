<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫之都音乐馆 - 蘿嵐的个人博客</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        macaron: {
                            pink: '#f8cad5',
                            blue: '#b9d8e0',
                            green: '#bcebcb',
                            yellow: '#fff3ba',
                            purple: '#d8b9e0',
                            orange: '#ffd6ba'
                        },
                        primary: '#6dae8d',
                        secondary: '#7ba6b9',
                        dark: '#4a5559'
                    },
                    fontFamily: {
                        cute: ['"Comic Sans MS"', '"Marker Felt"', 'sans-serif']
                    },
                    boxShadow: {
                        'music': '0 10px 25px -5px rgba(185, 216, 224, 0.3)',
                        'music-hover': '0 20px 35px -10px rgba(185, 216, 224, 0.4)',
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .vinyl-spin { animation: spin 20s linear infinite; }
            .pulse-light { animation: pulse-light 2s infinite; }
            .hover-scale {
                transition: transform 0.3s ease;
            }
            .hover-scale:hover { transform: scale(1.03); }
            .btn-pop {
                transition: all 0.2s ease;
            }
            .btn-pop:hover { transform: translateY(-2px); }
            .btn-pop:active { transform: translateY(0); }
        }
    </style>
    
    <style>
        /* 动画效果 */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse-light {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        /* 频谱柱条 - 更自然的高度变化 */
        .eq-bar {
            transition: height 0.08s ease-out;
            border-radius: 3px 3px 0 0;
        }
        
        /* 平滑滚动 */
        html { scroll-behavior: smooth; }
        
        /* 进度条样式 */
        .progress-bar {
            height: 6px;
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
            overflow: visible;
            cursor: pointer;
            transition: height 0.15s ease, background-color 0.2s ease;
            position: relative;
        }
        .progress-bar:hover { background-color: rgba(0, 0, 0, 0.15); }
        .progress-bar.dragging { height: 10px; }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #b9d8e0, #6dae8d);
            width: 0%;
            transition: width 0.05s linear;
            border-radius: 3px;
            position: relative;
        }
        
        .progress-thumb {
            position: absolute;
            right: -7px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #6dae8d;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(109,174,141,0.5);
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .progress-bar.dragging .progress-thumb,
        .progress-bar:hover .progress-thumb {
            opacity: 1;
        }
        .progress-bar.dragging .progress-thumb {
            transform: translateY(-50%) scale(1.3);
        }
        
        /* 音量条样式 */
        .volume-bar {
            height: 4px;
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 2px;
            overflow: visible;
            cursor: pointer;
            transition: height 0.15s ease, background-color 0.2s ease;
            position: relative;
        }
        .volume-bar:hover { background-color: rgba(0, 0, 0, 0.15); }
        .volume-bar.dragging { height: 8px; }
        
        .volume-fill {
            height: 100%;
            background: linear-gradient(90deg, #f8cad5, #d8b9e0);
            width: 80%;
            border-radius: 2px;
            transition: width 0.05s linear;
            position: relative;
        }
        
        .volume-thumb {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: #d8b9e0;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(216,185,224,0.5);
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .volume-bar.dragging .volume-thumb,
        .volume-bar:hover .volume-thumb {
            opacity: 1;
        }
        .volume-bar.dragging .volume-thumb {
            transform: translateY(-50%) scale(1.3);
        }
        
        /* 音乐列表滚动条 */
        .music-list-container::-webkit-scrollbar { width: 4px; }
        .music-list-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 2px;
        }
        .music-list-container::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 2px;
        }
        
        /* 均衡器柱条底色 */
        .eq-bar-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
        }
    </style>
</head>

<body class="font-cute bg-gradient-to-br from-gray-50 to-macaron-blue/5 text-dark min-h-screen">
    <!-- 左侧导航边栏 -->
    <div class="fixed top-0 left-0 h-full w-64 bg-white shadow-xl z-40 transform transition-transform duration-300 ease-in-out md:translate-x-0 -translate-x-full" id="main-sidebar">
        <div class="p-5 border-b bg-gradient-to-r from-macaron-purple/20 to-transparent">
            <h2 class="text-xl font-bold text-macaron-purple">导航菜单</h2>
        </div>
        
        <div class="p-4">
            <a href="index.html" class="flex items-center p-3 rounded-xl hover:bg-gray-100 mb-2 transition-all btn-pop">
                <i class="fa fa-home w-8 text-center"></i>
                <span>首页</span>
            </a>
            <a href="passage.html" class="flex items-center p-3 rounded-xl hover:bg-gray-100 mb-2 transition-all btn-pop">
                <i class="fa fa-book w-8 text-center"></i>
                <span>茗沐大陆记事簿</span>
            </a>
            <a href="note.html" class="flex items-center p-3 rounded-xl hover:bg-gray-100 mb-2 transition-all btn-pop">
                <i class="fa fa-sticky-note w-8 text-center"></i>
                <span>蘿嵐随记簿</span>
            </a>
            <a href="music.html" class="flex items-center p-3 rounded-xl bg-macaron-purple bg-opacity-20 text-macaron-purple mb-2 transition-all">
                <i class="fa fa-headphones w-8 text-center"></i>
                <span><strong>猫之都音乐馆</strong></span>
            </a>
            <a href="photos.html" class="flex items-center p-3 rounded-xl hover:bg-gray-100 transition-all btn-pop">
                <i class="fa fa-camera w-8 text-center"></i>
                <span>摄影集</span>
            </a>
        </div>
    </div>
    
    <!-- 主内容区 -->
    <div class="min-h-screen transition-all duration-300 ease-in-out md:ml-64 p-4 md:p-6 lg:p-8">
        <!-- 顶部工具栏 -->
        <header class="sticky top-0 bg-white bg-opacity-90 backdrop-blur-sm shadow-sm z-30 p-4 rounded-2xl mb-6 hover-scale">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <button id="sidebar-toggle" class="mr-4 p-2 rounded-full hover:bg-gray-100 btn-pop">
                        <i class="fa fa-bars text-macaron-purple"></i>
                    </button>
                    <h1 class="text-xl md:text-2xl font-bold text-macaron-purple">猫之都音乐馆</h1>
                </div>
                <div>
                    <button id="shuffle-all" class="flex items-center space-x-2 bg-gradient-to-r from-macaron-pink/20 to-macaron-purple/20 hover:from-macaron-pink/30 hover:to-macaron-purple/30 text-dark px-4 py-2 rounded-full btn-pop">
                        <i class="fa fa-random"></i>
                        <span>随机播放全部</span>
                    </button>
                </div>
            </div>
        </header>
        
        <!-- 音乐内容区 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左侧：音乐列表 -->
            <div class="lg:col-span-1 bg-white rounded-3xl shadow-music p-4 md:p-6 hover-scale">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-macaron-blue">音乐列表</h2>
                    <span class="bg-macaron-blue bg-opacity-20 text-dark px-3 py-1 rounded-full text-sm" id="total-songs">0首歌曲</span>
                </div>
                
                <!-- 搜索框 -->
                <div class="relative mb-6">
                    <input type="text" id="music-search" placeholder="搜索歌曲..." class="w-full px-4 py-2 pl-10 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-macaron-blue focus:border-transparent transition-all">
                    <i class="fa fa-search absolute left-3 top-3 text-gray-400"></i>
                </div>
                
                <!-- 音乐列表 -->
                <div class="music-list-container overflow-y-auto max-h-[calc(100vh-360px)] pr-2" id="music-list">
                    <div class="flex flex-col items-center justify-center p-10">
                        <div class="text-4xl text-macaron-blue mb-4">

                </div>
            </div>
            
            <!-- 右侧：播放界面 -->
            <div class="lg:col-span-2 flex flex-col">
                <!-- 专辑封面和信息 -->
                <div class="bg-white rounded-3xl shadow-music p-6 mb-6 flex flex-col md:flex-row items-center hover-scale">
                    <!-- 专辑封面 -->
                    <div class="relative album-cover mb-6 md:mb-0 md:mr-8 group">
                        <div class="w-48 h-48 md:w-64 md:h-64 rounded-full bg-gradient-to-br from-macaron-purple/30 to-macaron-blue/30 flex items-center justify-center overflow-hidden shadow-lg">
                            <img id="album-cover" src="https://picsum.photos/300/300?random=1" alt="专辑封面" class="w-full h-full object-cover rounded-full">
                            <div class="absolute inset-0 rounded-full border-8 border-black border-opacity-80 transform scale-95 group-hover:scale-90 transition-transform">
                                <div class="absolute inset-0 flex items-center justify-center">
                                    <div class="w-16 h-16 rounded-full bg-macaron-yellow/80"></div>
                                </div>
                            </div>
                        </div>
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity bg-black/30 rounded-full">
                            <div class="w-16 h-16 rounded-full bg-white/90 flex items-center justify-center">
                                <i class="fa fa-play text-macaron-green text-2xl"></i>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 歌曲信息 -->
                    <div class="text-center md:text-left flex-1">
                        <h2 id="current-song-title" class="text-2xl md:text-3xl font-bold mb-2 text-dark truncate">未播放音乐</h2>
                        <p id="current-song-artist" class="text-gray-600 mb-4">艺术家</p>
                        <p id="current-song-album" class="text-gray-500 text-sm">专辑</p>
                        
                        <!-- 频谱动画柱条 -->
                        <div class="mt-8 flex items-end justify-center h-12 space-x-1" id="eq-container">
                            <!-- 由JS动态生成 -->
                        </div>
                    </div>
                </div>
                
                <!-- 播放控制 -->
                <div class="bg-white rounded-3xl shadow-music p-6 hover-scale flex-1">
                    <h3 class="text-lg font-bold mb-6 text-macaron-green">播放控制</h3>
                    
                    <!-- 进度条和时间 -->
                    <div class="mb-8">
                        <div class="flex justify-between text-sm text-gray-500 mb-2">
                            <span id="current-time">00:00</span>
                            <span id="total-time">00:00</span>
                        </div>
                        <div class="progress-bar" id="progress-bar">
                            <div class="progress-fill" id="progress-fill">

                            </div>

                    </div>
                    
                    <!-- 控制按钮 -->
                    <div class="flex justify-center items-center mb-8 space-x-2 sm:space-x-6">

                        </button>
                        <button id="play-pause" class="p-6 bg-gradient-to-r from-macaron-green/80 to-primary text-white rounded-full shadow-lg btn-pop" title="播放/暂停">
                            <i class="fa fa-play text-3xl"></i>
                        </button>
                        <button id="next-song" class="p-4 text-gray-700 btn-pop" title="下一首">
                            <i class="fa fa-step-forward text-2xl"></i>
                        </button>
                        <button id="shuffle" class="p-3 text-gray-600 btn-pop" title="随机播放">
                            <i class="fa fa-random text-xl"></i>
                        </button>
                    </div>
                    
                    <!-- 音量控制 -->
                    <div class="flex items-center justify-center mb-10">
                        <button id="mute" class="mr-3 text-gray-600 btn-pop" title="静音">
                            <i class="fa fa-volume-up text-xl"></i>
                        </button>
                        <div class="volume-bar w-48 md:w-64" id="volume-bar">
                            <div class="volume-fill" id="volume-fill">
                                <div class="volume-thumb" id="volume-thumb"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 音效设置（视觉展示） -->
                    <div>
                        <h4 class="text-md font-bold mb-4 text-macaron-orange">音效设置</h4>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <button class="eq-preset bg-gradient-to-r from-macaron-blue/20 to-transparent hover:from-macaron-blue/30 py-2 rounded-xl text-sm btn-pop active" data-preset="normal">标准</button>
                            <button class="eq-preset bg-gradient-to-r from-macaron-pink/20 to-transparent hover:from-macaron-pink/30 py-2 rounded-xl text-sm btn-pop" data-preset="pop">流行</button>
                            <button class="eq-preset bg-gradient-to-r from-macaron-green/20 to-transparent hover:from-macaron-green/30 py-2 rounded-xl text-sm btn-pop" data-preset="rock">摇滚</button>
                            <button class="eq-preset bg-gradient-to-r from-macaron-purple/20 to-transparent hover:from-macaron-purple/30 py-2 rounded-xl text-sm btn-pop" data-preset="classical">古典</button>
                            <button class="eq-preset bg-gradient-to-r from-macaron-yellow/20 to-transparent hover:from-macaron-yellow/30 py-2 rounded-xl text-sm btn-pop" data-preset="jazz">爵士</button>
                            <button class="eq-preset bg-gradient-to-r from-macaron-orange/20 to-transparent hover:from-macaron-orange/30 py-2 rounded-xl text-sm btn-pop" data-preset="bass">重低音</button>
                            <button class="eq-preset bg-gradient-to-r from-macaron-blue/20 to-transparent hover:from-macaron-blue/30 py-2 rounded-xl text-sm btn-pop" data-preset="vocal">人声</button>
                            <button class="eq-preset bg-gradient-to-r from-macaron-pink/20 to-transparent hover:from-macaron-pink/30 py-2 rounded-xl text-sm btn-pop" data-preset="electronic">电子</button>
                        </div>
                        <!-- 提示文字 -->

                            <i class="fa fa-info-circle mr-1"></i>音效预设为视觉风格展示，实际音频处理需要后端支持
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 底部迷你播放器 -->
    <div class="lg:hidden fixed bottom-0 left-0 right-0 bg-white bg-opacity-95 backdrop-blur-sm shadow-lg p-3 border-t z-40 hidden" id="mini-player">
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <img id="mini-cover" src="https://picsum.photos/60/60?random=1" alt="当前播放" class="w-12 h-12 rounded-md mr-3">
                <div>
                    <h4 id="mini-song-title" class="text-sm font-bold truncate w-24">未播放音乐</h4>
                    <p id="mini-song-artist" class="text-xs text-gray-500 truncate w-24">艺术家</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button id="mini-prev" class="text-gray-600 btn-pop"><i class="fa fa-step-backward"></i></button>
                <button id="mini-play-pause" class="bg-macaron-green text-white p-2 rounded-full btn-pop"><i class="fa fa-play"></i></button>
                <button id="mini-next" class="text-gray-600 btn-pop"><i class="fa fa-step-forward"></i></button>
            </div>
        </div>
    </div>
    
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden transition-opacity duration-300"></div>

    <script>
    // ========== 全局变量 ==========
    let musicList = [];
    let currentMusicIndex = -1;
    let audio = new Audio();
    let audioContext = null;
    let analyser = null;
    let audioSourceNode = null;   // 保存已连接的 source，避免重复创建
    let isPlaying = false;
    let repeatMode = 0;          // 0-列表循环，1-单曲循环，2-随机播放
    let volume = 0.8;
    let isMuted = false;
    let originalVolume = volume;
    let currentEqPreset = 'normal';
    let eqBars = [];             // 频谱柱条DOM引用
    let eqColors = [
        '#f8cad5', '#b9d8e0', '#bcebcb',
        '#fff3ba', '#d8b9e0', '#ffd6ba',
        '#f8cad5', '#b9d8e0'
    ];
    let isAudioContextConnected = false; // 修复：标记 audioContext 是否已连接

    // EQ预设参数（用于动画视觉风格）
    const EQ_PRESETS = {
        normal:     { avg: 55, variance: 15, speed: 0.08 },
        pop:        { avg: 65, variance: 25, speed: 0.12 },
        rock:       { avg: 60, variance: 35, speed: 0.15 },
        classical:  { avg: 50, variance: 20, speed: 0.06 },
        jazz:       { avg: 52, variance: 28, speed: 0.09 },
        bass:       { avg: 70, variance: 20, speed: 0.10 },
        vocal:      { avg: 58, variance: 18, speed: 0.08 },
        electronic: { avg: 68, variance: 30, speed: 0.18 }
    };

    // ========== DOM元素 ==========
    const dom = {};
    function getEl(id) { return document.getElementById(id); }
    function initDoms() {
        dom.mainSidebar    = getEl('main-sidebar');
        dom.sidebarToggle  = getEl('sidebar-toggle');
        dom.overlay        = getEl('overlay');
        dom.musicList      = getEl('music-list');
        dom.totalSongs     = getEl('total-songs');
        dom.musicSearch    = getEl('music-search');
        dom.title          = getEl('current-song-title');
        dom.artist         = getEl('current-song-artist');
        dom.album          = getEl('current-song-album');
        dom.albumCover     = getEl('album-cover');
        dom.currentTime    = getEl('current-time');
        dom.totalTime      = getEl('total-time');
        dom.progressBar    = getEl('progress-bar');
        dom.progressFill   = getEl('progress-fill');
        dom.playPause      = getEl('play-pause');
        dom.prevBtn        = getEl('prev-song');
        dom.nextBtn        = getEl('next-song');
        dom.repeatBtn      = getEl('repeat-mode');
        dom.shuffleBtn     = getEl('shuffle');
        dom.muteBtn        = getEl('mute');
        dom.volumeBar      = getEl('volume-bar');
        dom.volumeFill     = getEl('volume-fill');
        dom.shuffleAll     = getEl('shuffle-all');
        dom.miniPlayer     = getEl('mini-player');
        dom.miniTitle      = getEl('mini-song-title');
        dom.miniArtist     = getEl('mini-song-artist');
        dom.miniCover      = getEl('mini-cover');
        dom.miniPlayPause  = getEl('mini-play-pause');
        dom.miniPrev       = getEl('mini-prev');
        dom.miniNext       = getEl('mini-next');
    }

    // ========== 初始化 ==========
    document.addEventListener('DOMContentLoaded', () => {
        initDoms();
        buildEqBars();          // 先生成EQ柱条DOM
        loadMusicList();
        bindEvents();
        initAudio();
        startEqAnimation();     // 启动动画（使用模拟数据，不依赖audioContext）
    });

    // ========== 生成频谱柱条 ==========
    function buildEqBars() {
        const container = document.getElementById('eq-container');
        container.innerHTML = '';
        eqBars = [];
        for (let i = 0; i < 8; i++) {
            const wrap = document.createElement('div');
            wrap.className = 'eq-bar-wrap';

            const bar = document.createElement('div');
            bar.className = 'eq-bar';
            bar.style.cssText = `
                width: 14px;
                height: ${20 + (i % 4) * 15}%;
                background: linear-gradient(to top, ${eqColors[i]}, ${eqColors[(i+2)%8]}99);
                min-height: 6px;
            `;

            wrap.appendChild(bar);
            container.appendChild(wrap);
            eqBars.push(bar);
        }
    }

    // ========== 加载音乐列表 ==========
    function loadMusicList() {
        musicList = [
            { id:1, title:'hanabi',                  artist:'白萧', album:'夏日回忆',   file:'hanabi.flac',                     duration:'—' },
            { id:2, title:'大大世界小小猫（最终重混音伴奏）', artist:'白萧', album:'音乐收藏', file:'大大世界小小猫（最终重混音伴奏）.flac', duration:'—' },
            { id:3, title:'时年',                     artist:'白萧', album:'四时',      file:'时年.flac',                        duration:'—' }
        ];
        // 分配随机封面
        musicList.forEach(m => {
            m.cover = `https://picsum.photos/300/300?random=${m.id + 10}`;
        });
        if (dom.totalSongs) dom.totalSongs.textContent = `${musicList.length}首歌曲`;
        renderMusicList();
    }

    // ========== 渲染音乐列表 ==========
    function renderMusicList(filter = '') {
        if (!dom.musicList) return;
        dom.musicList.innerHTML = '';

        const filtered = filter
            ? musicList.filter(m => m.title.includes(filter) || m.artist.includes(filter))
            : musicList;

        if (filtered.length === 0) {
            dom.musicList.innerHTML = '<div class="text-center py-8 text-gray-400">没有找到符合条件的音乐</div>';
            return;
        }

        filtered.forEach((music, i) => {
            const isActive = currentMusicIndex === music.id - 1;
            const item = document.createElement('div');
            item.className = `music-item p-3 flex items-center justify-between rounded-lg cursor-pointer transition-all duration-200 ${isActive ? 'bg-macaron-green/20 ring-1 ring-macaron-green/40' : 'hover:bg-gray-100 hover-scale'}`;
            item.dataset.index = music.id - 1;
            item.innerHTML = `
                <div class="flex items-center min-w-0">
                    <span class="w-7 text-center text-sm ${isActive ? 'text-macaron-green font-bold' : 'text-gray-400'}">${isActive ? '<i class="fa fa-volume-up"></i>' : music.id}</span>
                    <div class="min-w-0">
                        <span class="block font-medium text-sm truncate ${isActive ? 'text-macaron-green' : ''}">${music.title}</span>
                        <span class="block text-xs text-gray-400 truncate">${music.artist} · ${music.album}</span>
                    </div>
                </div>
                <span class="text-xs text-gray-400 ml-2 flex-shrink-0">${music.duration}</span>
            `;
            item.addEventListener('click', () => playMusic(parseInt(item.dataset.index)));
            dom.musicList.appendChild(item);
        });
    }

    // ========== 播放音乐 ==========
    function playMusic(index) {
        if (index < 0 || index >= musicList.length) return;

        currentMusicIndex = index;
        const music = musicList[index];

        // 更新UI
        if (dom.title)     dom.title.textContent = music.title;
        if (dom.artist)    dom.artist.textContent = music.artist;
        if (dom.album)     dom.album.textContent = music.album;
        if (dom.albumCover){ dom.albumCover.src = music.cover; dom.albumCover.onerror = () => dom.albumCover.src = `https://picsum.photos/300/300?random=${music.id}`; }
        if (dom.miniTitle)  dom.miniTitle.textContent = music.title;
        if (dom.miniArtist) dom.miniArtist.textContent = music.artist;
        if (dom.miniCover) { dom.miniCover.src = music.cover; dom.miniCover.onerror = () => dom.miniCover.src = `https://picsum.photos/60/60?random=${music.id}`; }
        if (dom.miniPlayer) dom.miniPlayer.classList.remove('hidden');

        // 设置音频源
        audio.src = `static/music/${music.file}`;
        audio.load();

        // 尝试初始化音频上下文（用户交互后才能调用）
        tryInitAudioContext();

        audio.play().then(() => {
            isPlaying = true;
            updatePlayPauseButton();
            renderMusicList(dom.musicSearch ? dom.musicSearch.value : '');
        }).catch(err => {
            console.warn('播放失败:', err);
            isPlaying = false;
            updatePlayPauseButton();
        });
    }

    // ========== 初始化音频上下文（延迟到用户交互后） ==========
    function tryInitAudioContext() {
        if (audioContext) {
            // 音频上下文已存在，只需连接一次
            tryConnectSource();
            return;
        }
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 128;
            tryConnectSource();
        } catch (e) {
            console.warn('音频上下文初始化失败（可能受跨域限制）:', e);
            audioContext = null;
            analyser = null;
        }
    }

    // ========== 连接音频源（只执行一次） ==========
    function tryConnectSource() {
        if (!audioContext || !analyser || isAudioContextConnected) return;
        try {
            if (audioContext.state === 'suspended') audioContext.resume();
            if (audioSourceNode) {
                try { audioSourceNode.disconnect(); } catch(e) {}
            }
            audioSourceNode = audioContext.createMediaElementSource(audio);
            audioSourceNode.connect(analyser);
            analyser.connect(audioContext.destination);
            isAudioContextConnected = true;
            console.log('音频分析器连接成功');
        } catch (e) {
            console.warn('音频源连接失败（FLAC跨域限制或重复调用）:', e);
            // 不影响播放，继续用模拟动画
        }
    }

    // ========== 拖动辅助函数 ==========
    function initDrag(barEl, onDragCb) {
        if (!barEl) return;
        let dragging = false;
        const getX = (e) => e.touches ? e.touches[0].clientX : e.clientX;
        const onStart = (e) => {
            dragging = true;
            barEl.classList.add('dragging');
            onDragCb(getX(e));
        };
        const onMove = (e) => { if (!dragging) return; onDragCb(getX(e)); };
        const onEnd = () => { dragging = false; barEl.classList.remove('dragging'); };
        barEl.addEventListener('mousedown', onStart);
        barEl.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(e); }, { passive: false });
        document.addEventListener('mousemove', onMove);
        document.addEventListener('touchmove', (e) => { if (dragging) { e.preventDefault(); onMove(e); } }, { passive: false });
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchend', onEnd);
    }

    // ========== 绑定事件 ==========
    function bindEvents() {
        dom.sidebarToggle?.addEventListener('click', toggleSidebar);
        dom.overlay?.addEventListener('click', toggleSidebar);
        dom.playPause?.addEventListener('click', togglePlayPause);
        dom.miniPlayPause?.addEventListener('click', togglePlayPause);
        dom.prevBtn?.addEventListener('click', playPrevious);
        dom.nextBtn?.addEventListener('click', playNext);
        dom.miniPrev?.addEventListener('click', playPrevious);
        dom.miniNext?.addEventListener('click', playNext);
        // 进度条拖动（支持点击+拖动跟随）
        initDrag(dom.progressBar, (clientX) => {
            if (!dom.progressBar || isNaN(audio.duration)) return;
            const rect = dom.progressBar.getBoundingClientRect();
            const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            audio.currentTime = pos * audio.duration;
            if (dom.progressFill) dom.progressFill.style.width = `${pos * 100}%`;
            if (dom.currentTime) dom.currentTime.textContent = formatTime(audio.currentTime);
        });
        dom.musicSearch?.addEventListener('input', e => renderMusicList(e.target.value));
        dom.repeatBtn?.addEventListener('click', changeRepeatMode);
        dom.shuffleAll?.addEventListener('click', shuffleAndPlayAll);
        dom.shuffleBtn?.addEventListener('click', () => {
            if (repeatMode === 2) {
                changeRepeatMode();
            } else {
                repeatMode = 2;
                dom.repeatBtn && (dom.repeatBtn.innerHTML = '<i class="fa fa-random text-xl"></i>');
                dom.repeatBtn?.classList.remove('text-macaron-orange');
                dom.repeatBtn?.classList.add('text-macaron-pink');
            }
        });
        // 音量条拖动（支持点击+拖动跟随）
        initDrag(dom.volumeBar, (clientX) => {
            if (!dom.volumeBar) return;
            const rect = dom.volumeBar.getBoundingClientRect();
            volume = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            if (!isMuted) audio.volume = volume;
            if (dom.volumeFill) dom.volumeFill.style.width = `${volume * 100}%`;
            if (isMuted && volume > 0) { isMuted = false; dom.muteBtn && (dom.muteBtn.innerHTML = '<i class="fa fa-volume-up text-xl"></i>'); }
        });
        dom.muteBtn?.addEventListener('click', toggleMute);
        document.querySelectorAll('.eq-preset').forEach(btn => {
            btn.addEventListener('click', () => setEqPreset(btn.dataset.preset));
        });
    }

    // ========== 初始化Audio对象 ==========
    function initAudio() {
        audio.volume = volume;
        audio.addEventListener('timeupdate', () => {
            if (isNaN(audio.duration)) return;
            const pct = (audio.currentTime / audio.duration) * 100;
            dom.progressFill && (dom.progressFill.style.width = `${pct}%`);
            if (dom.currentTime) dom.currentTime.textContent = formatTime(audio.currentTime);
        });
        audio.addEventListener('loadedmetadata', () => {
            if (dom.totalTime) dom.totalTime.textContent = formatTime(audio.duration);
            if (musicList[currentMusicIndex]) {
                musicList[currentMusicIndex].duration = formatTime(audio.duration);
                renderMusicList(dom.musicSearch ? dom.musicSearch.value : '');
            }
        });
        audio.addEventListener('ended', handleAudioEnd);
        audio.addEventListener('play',  () => { isPlaying = true;  updatePlayPauseButton(); });
        audio.addEventListener('pause', () => { isPlaying = false; updatePlayPauseButton(); });
    }

    // ========== 播放/暂停 ==========
    function togglePlayPause() {
        if (currentMusicIndex === -1 && musicList.length > 0) { playMusic(0); return; }
        isPlaying ? audio.pause() : audio.play();
    }

    function updatePlayPauseButton() {
        const icon = isPlaying ? 'fa-pause' : 'fa-play';
        if (dom.playPause)     dom.playPause.innerHTML = `<i class="fa ${icon} text-3xl"></i>`;
        if (dom.miniPlayPause) dom.miniPlayPause.innerHTML = `<i class="fa ${icon}"></i>`;
    }

    // ========== 上一首/下一首 ==========
    function playPrevious() {
        if (!musicList.length) return;
        let idx = currentMusicIndex - 1;
        if (idx < 0) idx = musicList.length - 1;
        playMusic(idx);
    }

    function playNext() {
        if (!musicList.length) return;
        if (repeatMode === 2) {
            let idx;
            do { idx = Math.floor(Math.random() * musicList.length); }
            while (idx === currentMusicIndex && musicList.length > 1);
            playMusic(idx);
        } else {
            let idx = currentMusicIndex + 1;
            if (idx >= musicList.length) idx = 0;
            playMusic(idx);
        }
    }

    function handleAudioEnd() {
        if (repeatMode === 1) { audio.currentTime = 0; audio.play(); }
        else playNext();
    }

    // ========== 进度条 ==========
    function updateProgressByClick(e) {
        if (!dom.progressBar) return;
        const rect = dom.progressBar.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pos * audio.duration;
        if (dom.progressFill) dom.progressFill.style.width = `${pos * 100}%`;
        if (dom.currentTime) dom.currentTime.textContent = formatTime(audio.currentTime);
    }

    // ========== 音量 ==========
    function toggleMute() {
        if (!dom.muteBtn || !dom.volumeFill) return;
        isMuted = !isMuted;
        if (isMuted) {
            originalVolume = volume;
            audio.volume = 0;
            dom.volumeFill.style.width = '0%';
            dom.muteBtn.innerHTML = '<i class="fa fa-volume-off text-xl"></i>';
        } else {
            volume = originalVolume;
            audio.volume = volume;
            dom.volumeFill.style.width = `${volume * 100}%`;
            dom.muteBtn.innerHTML = '<i class="fa fa-volume-up text-xl"></i>';
        }
    }

    function updateVolumeByClick(e) {
        if (!dom.volumeBar) return;
        const rect = dom.volumeBar.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        volume = Math.max(0, Math.min(1, pos));
        if (!isMuted) audio.volume = volume;
        if (dom.volumeFill) dom.volumeFill.style.width = `${volume * 100}%`;
        if (isMuted && volume > 0) { isMuted = false; dom.muteBtn && (dom.muteBtn.innerHTML = '<i class="fa fa-volume-up text-xl"></i>'); }
    }

    // ========== 循环模式 ==========
    function changeRepeatMode() {
        if (!dom.repeatBtn) return;
        repeatMode = (repeatMode + 1) % 3;
        const labels = ['列表循环', '单曲循环', '随机播放'];
        const icons  = ['fa-repeat', 'fa-repeat', 'fa-random'];
        const colors = ['', 'text-macaron-orange', 'text-macaron-pink'];
        dom.repeatBtn.innerHTML = `<i class="fa ${icons[repeatMode]} text-xl"></i>${repeatMode === 1 ? '<span class="absolute top-1 right-1 w-1 h-1 bg-macaron-orange rounded-full"></span>' : ''}`;
        dom.repeatBtn.className = `p-3 btn-pop ${colors[repeatMode]}`.trim();
    }

    // ========== 随机播放全部 ==========
    function shuffleAndPlayAll() {
        if (!musicList.length) return;
        musicList.sort(() => Math.random() - 0.5);
        repeatMode = 2;
        playMusic(0);
    }

    // ========== 侧边栏 ==========
    function toggleSidebar() {
        if (!dom.mainSidebar || !dom.overlay) return;
        dom.mainSidebar.classList.toggle('-translate-x-full');
        dom.overlay.classList.toggle('hidden');
    }

    // ========== 音效预设 ==========
    function setEqPreset(preset) {
        document.querySelectorAll('.eq-preset').forEach(btn => {
            btn.classList.remove('active', 'ring-2', 'ring-macaron-purple/50');
            btn.className = btn.className.replace(/from-\w+\/30/, 'from-gray-100/20');
        });
        const active = document.querySelector(`.eq-preset[data-preset="${preset}"]`);
        if (active) {
            active.classList.add('active', 'ring-2', 'ring-macaron-purple/50');
        }
        currentEqPreset = preset;
        showNotification(`音效模式: ${preset}`, 'info');
    }

    // ========== 频谱动画（核心修复） ==========
    // 模拟数据的相位状态（每个柱条独立）
    const eqPhase = Array.from({ length: 8 }, () => ({ phase: Math.random() * Math.PI * 2, speed: 1 }));

    function startEqAnimation() {
        let frameCount = 0;

        function animate() {
            frameCount++;
            const preset = EQ_PRESETS[currentEqPreset] || EQ_PRESETS.normal;

            if (isPlaying && analyser && isAudioContextConnected) {
                // 真实频谱数据（仅在音频上下文成功连接时使用）
                try {
                    const bufLen = analyser.frequencyBinCount;
                    const dataArr = new Uint8Array(bufLen);
                    analyser.getByteFrequencyData(dataArr);
                    eqBars.forEach((bar, i) => {
                        const raw = dataArr[Math.floor(i * bufLen / 8)] || 0;
                        const h = Math.max(6, (raw / 255) * 100);
                        bar.style.height = `${h}%`;
                    });
                } catch (e) {
                    // fallback 到模拟
                    simulateEq(preset, frameCount);
                }
            } else if (isPlaying) {
                // 模拟频谱动画（没有Web Audio时使用）
                simulateEq(preset, frameCount);
            } else {
                // 暂停状态：轻微浮动
                eqBars.forEach((bar, i) => {
                    const idle = 15 + Math.sin(frameCount * 0.02 + i * 0.8) * 8;
                    bar.style.height = `${idle}%`;
                });
            }

            requestAnimationFrame(animate);
        }

        // 初始静止状态
        eqBars.forEach((bar, i) => {
            bar.style.height = `${20 + (i % 4) * 15}%`;
        });

        animate();
    }

    // 模拟频谱动画
    function simulateEq(preset, frame) {
        eqBars.forEach((bar, i) => {
            eqPhase[i].phase += eqPhase[i].speed * preset.speed;
            const noise = Math.sin(eqPhase[i].phase) * preset.variance;
            const base  = preset.avg + noise;
            const h     = Math.max(6, Math.min(98, base + Math.random() * 10 - 5));
            bar.style.height = `${h}%`;
        });
    }

    // ========== 工具函数 ==========
    function formatTime(sec) {
        if (!sec || isNaN(sec)) return '0:00';
        return `${Math.floor(sec / 60)}:${Math.floor(sec % 60).toString().padStart(2, '0')}`;
    }

    function showNotification(msg, type = 'info') {
        let n = document.getElementById('music-notification');
        if (n) n.remove();
        n = document.createElement('div');
        n.id = 'music-notification';
        const colors = { success:'bg-macaron-green/90', error:'bg-red-100/90', warning:'bg-macaron-yellow/90', info:'bg-macaron-blue/90' };
        const icons  = { success:'fa-check-circle', error:'fa-exclamation-circle', warning:'fa-exclamation-triangle', info:'fa-info-circle' };
        n.className = `fixed bottom-20 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full shadow-lg z-50 ${colors[type] || colors.info} text-dark flex items-center space-x-2 transition-all duration-300 opacity-0`;
        n.innerHTML = `<i class="fa ${icons[type] || icons.info}"></i><span>${msg}</span>`;
        document.body.appendChild(n);
        requestAnimationFrame(() => n.style.opacity = '1');
        setTimeout(() => { n.style.opacity = '0'; setTimeout(() => n.remove(), 300); }, 2500);
    }
    </script>
</body>
