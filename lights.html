        .dice-icon-6 .dot:nth-child(5) { bottom: 0.18rem; left: 0.18rem; }

    <script>
        // ==================== 游戏状态 ====================
        let size = 5;                 // 当前棋盘尺寸
        let grid = [];                // 1=亮 0=灭
        let moves = 0;                // 当前步数
        let par = 0;                  // 本关最优步数
        let won = false;              // 是否已通关
        let soundOn = true;

        // ==================== 音效（WebAudio 合成） ====================
        let audioCtx = null;
        function getCtx() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                catch (e) { return null; }
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function beep(freq, dur, type, vol, delay) {
            if (!soundOn) return;
            const ctx = getCtx();
            if (!ctx) return;
            const t = ctx.currentTime + (delay || 0);
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, t);
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.001, t + dur);
            osc.connect(g).connect(ctx.destination);
            osc.start(t);
            osc.stop(t + dur + 0.05);
        }
        const sfx = {
            tap:  () => beep(240, 0.08, 'triangle', 0.12),
            flip: () => { beep(330, 0.1, 'sine', 0.1); beep(440, 0.12, 'sine', 0.08, 0.05); },
            hint: () => { beep(660, 0.1, 'sine', 0.1); beep(660, 0.1, 'sine', 0.1, 0.14); },
            win:  () => [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.28, 'sine', 0.14, i * 0.13))
        };
        function toggleSound() {
            soundOn = !soundOn;
            const btn = document.getElementById('btn-sound');
            btn.innerHTML = soundOn ? '<i class="fa fa-volume-up"></i>' : '<i class="fa fa-volume-off"></i>';
        }

        // ==================== 核心逻辑 ====================
        // 翻转格子 i 及其上下左右（十字）
        function press(g, i) {
            const r = Math.floor(i / size), c = i % size;
            const flip = j => { if (j >= 0 && j < g.length) g[j] ^= 1; };
            flip(i);
            if (r > 0) flip(i - size);
            if (r < size - 1) flip(i + size);
            if (c > 0) flip(i - 1);
            if (c < size - 1) flip(i + 1);
        }

        // ==================== GF(2) 高斯消元求解器 ====================
        // 求 x 使得 A·x = b (mod 2)，A 为十字翻转矩阵
        // 返回汉明重量最小的解（即最少步数按法）；无解返回 null
        function solve(b) {
            const N = size * size;
            // 构建增广矩阵
            const M = [];
            for (let i = 0; i < N; i++) {
                const row = new Array(N + 1).fill(0);
                row[i] = 1;
                if (i >= size) row[i - size] = 1;
                if (i < N - size) row[i + size] = 1;
                if (i % size !== 0) row[i - 1] = 1;
                if (i % size !== size - 1) row[i + 1] = 1;
                row[N] = b[i];
                M.push(row);
            }
            // 高斯消元（模 2）
            const pivotCol = new Array(N).fill(-1);
            let r = 0;
            for (let c = 0; c < N && r < N; c++) {
                let pr = -1;
                for (let i = r; i < N; i++) if (M[i][c]) { pr = i; break; }
                if (pr === -1) continue;
                const tmp = M[r]; M[r] = M[pr]; M[pr] = tmp;
                for (let i = 0; i < N; i++) {
                    if (i !== r && M[i][c]) {
                        for (let j = c; j <= N; j++) M[i][j] ^= M[r][j];
                    }
                }
                pivotCol[r] = c;
                r++;
            }
            // 无解检测（不会发生在本游戏生成的关卡）
            for (let i = r; i < N; i++) if (M[i][N]) return null;
            // 自由变量
            const isPivot = new Array(N).fill(false);
            for (let i = 0; i < r; i++) isPivot[pivotCol[i]] = true;
            const freeCols = [];
            for (let c = 0; c < N; c++) if (!isPivot[c]) freeCols.push(c);
            const k = freeCols.length;
            // 枚举自由变量（k ≤ 4），取步数最少的解
            let best = null, bestW = Infinity;
            for (let mask = 0; mask < (1 << k); mask++) {
                const x = new Array(N).fill(0);
                for (let j = 0; j < k; j++) x[freeCols[j]] = (mask >> j) & 1;
                for (let i = 0; i < r; i++) {
                    const c = pivotCol[i];
                    let v = M[i][N];
                    for (let j = 0; j < k; j++) if (x[freeCols[j]]) v ^= M[i][freeCols[j]];
                    if (v) x[c] = 1;
                }
                let w = 0;
                for (let i = 0; i < N; i++) w += x[i];
                if (w < bestW) { bestW = w; best = x; }
            }
            return best;
        }

        // ==================== 关卡生成 ====================
        // 从全灭状态逆推打乱，保证必然可解
        function genLevel() {
            const N = size * size;
            grid = new Array(N).fill(0);
            const idxs = [];
            for (let i = 0; i < N; i++) idxs.push(i);
            for (let i = idxs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const t = idxs[i]; idxs[i] = idxs[j]; idxs[j] = t;
            }
            let m;
            if (size === 3) m = 3 + Math.floor(Math.random() * 3);        // 3-5
            else if (size === 4) m = 5 + Math.floor(Math.random() * 4);   // 5-8
            else m = 8 + Math.floor(Math.random() * 6);                   // 8-13
            for (let i = 0; i < m; i++) press(grid, idxs[i]);
            // 计算最优步数（求解器给的解可能比打乱步数更短，尤其 4×4）
            const sol = solve(grid);
            par = sol ? sol.reduce((s, v) => s + v, 0) : m;
            moves = 0;
            won = false;
        }

        // ==================== 渲染 ====================
        const boardEl = document.getElementById('board');
        function buildBoard() {
            boardEl.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
            boardEl.innerHTML = '';
            for (let i = 0; i < size * size; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.i = i;
                boardEl.appendChild(cell);
            }
        }
        function updateBoard() {
            const cells = boardEl.children;
            for (let i = 0; i < cells.length; i++) {
                cells[i].classList.toggle('on', grid[i] === 1);
            }
        }
        function updateStats() {
            document.getElementById('stat-moves').textContent = moves;
            document.getElementById('stat-par').textContent = par;
            const best = localStorage.getItem('lights-best-' + size);
            document.getElementById('stat-best').textContent = best === null ? '-' : best;
            document.getElementById('note-par').textContent = par;
        }
        function pulseCells(indices) {
            indices.forEach(i => {
                const cell = boardEl.children[i];
                if (!cell) return;
                cell.classList.remove('pulse');
                void cell.offsetWidth; // 重启动画
                cell.classList.add('pulse');
                setTimeout(() => cell.classList.remove('pulse'), 300);
            });
        }

        // ==================== 交互 ====================
        boardEl.addEventListener('click', e => {
            const cell = e.target.closest('.cell');
            if (!cell || won) return;
            const i = parseInt(cell.dataset.i, 10);
            press(grid, i);
            moves++;
            sfx.tap(); sfx.flip();
            const affected = [i];
            const r = Math.floor(i / size), c = i % size;
            if (r > 0) affected.push(i - size);
            if (r < size - 1) affected.push(i + size);
            if (c > 0) affected.push(i - 1);
            if (c < size - 1) affected.push(i + 1);
            updateBoard();
            pulseCells(affected);
            updateStats();
            if (grid.every(v => v === 0)) doWin();
        });

        // 提示：求解当前局面，高亮最优解中的一格
        function showHint() {
            if (won) return;
            const sol = solve(grid);
            if (!sol) return;
            const targets = [];
            for (let i = 0; i < sol.length; i++) if (sol[i]) targets.push(i);
            if (targets.length === 0) return; // 已全灭
            const pick = targets[Math.floor(Math.random() * targets.length)];
            sfx.hint();
            const cell = boardEl.children[pick];
            cell.classList.remove('hint-glow');
            void cell.offsetWidth;
            cell.classList.add('hint-glow');
            setTimeout(() => cell.classList.remove('hint-glow'), 2200);
        }

        // ==================== 胜利 ====================
        function doWin() {
            won = true;
            boardEl.classList.add('board-locked');
            sfx.win();
            // 更新最佳记录
            const key = 'lights-best-' + size;
            const prev = localStorage.getItem(key);
            if (prev === null || moves < parseInt(prev, 10)) {
                localStorage.setItem(key, moves);
            }
            // 完美解判定
            const perfect = moves === par;
            document.getElementById('win-star').style.display = perfect ? 'block' : 'none';
            document.getElementById('win-moves').textContent = '用了 ' + moves + ' 步';
            document.getElementById('win-detail').textContent = perfect
                ? '完美解！正好等于最优步数 ' + par + ' 步'
                : '本关最优是 ' + par + ' 步，试试压到极限？';
            setTimeout(() => {
                document.getElementById('win-overlay').classList.add('show');
            }, 450);
            burstConfetti();
            updateStats();
        }
        function closeWin() {
            document.getElementById('win-overlay').classList.remove('show');
        }
        function burstConfetti() {
            const colors = ['#91A3B0', '#A3B18A', '#C9A9A6', '#D4A373', '#F5F5F0'];
            const rect = boardEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            for (let i = 0; i < 60; i++) {
                const p = document.createElement('span');
                p.className = 'confetti';
                p.style.left = cx + 'px';
                p.style.top = cy + 'px';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                const ang = Math.random() * Math.PI * 2;
                const dist = 120 + Math.random() * 220;
                p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
                p.style.setProperty('--dy', (Math.sin(ang) * dist - 100) + 'px');
                p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1400);
            }
        }

        // ==================== 难度切换 / 新关卡 ====================
        document.getElementById('seg-size').addEventListener('click', e => {
            const btn = e.target.closest('.seg-btn');
            if (!btn) return;
            size = parseInt(btn.dataset.size, 10);
            document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b === btn));
            startLevel();
        });

        function startLevel() {
            closeWin();
            boardEl.classList.remove('board-locked');
            genLevel();
            buildBoard();
            updateBoard();
            updateStats();
        }
        function newLevel(fromWin) {
            startLevel();
        }

        // ==================== 侧边栏开关 ====================
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('sidebar-overlay');
            if (!sb || !ov) return;
            const isOpen = sb.style.transform === 'translateX(0px)';
            if (isOpen) {
                sb.style.transform = 'translateX(-100%)';
                ov.classList.remove('show');
            } else {
                sb.style.transform = 'translateX(0)';
                ov.classList.add('show');
            }
        }

        // ==================== 启动 ====================
        startLevel();
    </script>
</body>
</html>
