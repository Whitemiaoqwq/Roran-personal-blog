    <script>
        // 在文件顶部的<script>标签中添加配置选项
        // 配置选项
        const config = {
            // 设置为true从GitHub加载文件，false从本地加载
            // 自动检测：本地调试用相对路径，GitHub Pages 用完整 CDN URL
            loadFromGithub: !window.location.hostname.match(/localhost|127\.0\.0\.1/),
            // GitHub仓库配置
            github: {
                owner: 'Whitemiaoqwq',
                repo: 'Roran-personal-blog',
                branch: 'main', // 或 'master'
                path: 'static/passage/' // 修复：去掉了重复的 'Roran-personal-blog/'
            },
            // 本地路径配置
            localPath: 'static/passage/'
        };
        
        // 生成文件URL的函数
        function getFileUrl(filename) {
            if (config.loadFromGithub) {
                // 从GitHub加载文件的URL格式
                return `https://raw.githubusercontent.com/${config.github.owner}/${config.github.repo}/${config.github.branch}/${config.github.path}${filename}`;
            } else {
                // 从本地加载文件
                return `${config.localPath}${filename}`;
            }
        }
    </script>
    
    <script>
        // 全局变量
        let chapters = [];           // 章节列表
        let currentChapterIndex = 0; // 当前章节索引
        let sortOrder = 'asc';       // 排序方式：asc正序，desc逆序
        let fontSize = 100;          // 字体大小百分比
        
        // DOM元素
        const mainSidebar = document.getElementById('main-sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const overlay = document.getElementById('overlay');
        const chapterSidebar = document.querySelector('.chapter-sidebar');
        const chapterToggle = document.getElementById('chapter-toggle');
        const chapterToggleBottom = document.getElementById('chapter-toggle-bottom');
        const closeChapter = document.getElementById('close-chapter');
        const chapterList = document.getElementById('chapter-list');
        const chapterTitle = document.getElementById('chapter-title');
        const readingArea = document.getElementById('reading-area');
        const prevChapter = document.getElementById('prev-chapter');
        const nextChapter = document.getElementById('next-chapter');
        const prevChapterBottom = document.getElementById('prev-chapter-bottom');
        const nextChapterBottom = document.getElementById('next-chapter-bottom');
        const orderAsc = document.getElementById('order-asc');
        const orderDesc = document.getElementById('order-desc');
        const fontSmaller = document.getElementById('font-smaller');
        const fontLarger = document.getElementById('font-larger');
        const themeDay = document.getElementById('theme-day');
        const themeEye = document.getElementById('theme-eye');
        const themeNight = document.getElementById('theme-night');
        const chapterOverlay = document.getElementById('chapter-overlay');
        // 移动端专用元素
        const sidebarToggleMobile = document.getElementById('sidebar-toggle-mobile');
        const sidebarCloseMobile = document.getElementById('sidebar-close-mobile');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const prevChapterMobile = document.getElementById('prev-chapter-mobile');
        const nextChapterMobile = document.getElementById('next-chapter-mobile');
        const chapterToggleMobile = document.getElementById('chapter-toggle-mobile');
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 加载章节列表
            loadChapters();
            
            // 绑定事件监听
            bindEvents();
            
            // 检查本地存储的设置
            loadSettings();
        });
        
        // 渲染章节列表
        function renderChapterList() {
            // 清空章节列表
            chapterList.innerHTML = '';
            
            // 根据排序方式对章节进行排序
            let sortedChapters = [...chapters];
            if (sortOrder === 'asc') {
                sortedChapters.sort((a, b) => a.id - b.id);
            } else {
                sortedChapters.sort((a, b) => b.id - a.id);
            }
            
            // 渲染每个章节
            sortedChapters.forEach((chapter, index) => {
                const chapterItem = document.createElement('div');
                chapterItem.className = `chapter-item p-3 cursor-pointer transition-all duration-200 ${currentChapterIndex === chapters.findIndex(c => c.id === chapter.id) ? 'bg-primary/10 text-primary border-l-4 border-primary' : 'hover:bg-gray-100 dark:hover:bg-gray-800'}`;
                chapterItem.innerHTML = `
                    <div class="chapter-number text-xs text-gray-500 mb-1">第${chapter.id}章</div>
                    <div class="chapter-title">${chapter.title}</div>
                `;
                
                // 绑定点击事件
                chapterItem.addEventListener('click', () => {
                    // 找到原始章节数组中的索引
                    const originalIndex = chapters.findIndex(c => c.id === chapter.id);
                    loadChapter(originalIndex);
                    
                    // 在移动设备上，点击章节后关闭侧边栏
                    if (window.innerWidth < 768) {
                        chapterSidebar.classList.remove('active');
                        chapterOverlay.classList.add('hidden');
                    }
                });
                
                chapterList.appendChild(chapterItem);
            });
        }
        
        // 加载章节列表
        function loadChapters() {
            // 显示加载状态
            chapterList.innerHTML = `
                <div class="flex justify-center items-center h-64">
                    <i class="fa fa-spinner fa-spin text-primary"></i>
                    <span class="ml-2">加载章节列表中...</span>
                </div>
            `;
            
            // 使用配置的URL请求manifest.json文件
            const manifestUrl = getFileUrl('manifest.json');
            
            fetch(manifestUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`无法加载章节清单: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    chapters = data;
                    
                    // 渲染章节列表
                    renderChapterList();
                    
                    // 默认加载第一章
                    if (chapters.length > 0) {
                        loadChapter(0);
                    }
                })
                .catch(error => {
                    console.error('加载章节列表时出错:', error);
                    
                    // 显示更详细的错误信息
                    chapterList.innerHTML = `
                        <div class="flex flex-col justify-center items-center h-64 text-red-500">
                            <i class="fa fa-exclamation-circle text-4xl mb-3"></i>
                            <p>无法加载章节列表</p>
                            <p class="text-sm mt-2">错误: ${error.message}</p>
                            <p class="text-sm mt-1">URL: ${manifestUrl}</p>
                        </div>
                    `;
                    
                    // 回退到模拟数据
                    chapters = [
                        { id: 1, title: "第一章：茗沐大陆的传说", file: "chapter1.md" },
                        { id: 2, title: "第二章：森林猫的诞生", file: "chapter2.md" },
                        { id: 3, title: "第三章：魔法学院的入学考试", file: "chapter3.md" },
                        { id: 4, title: "第四章：第一个魔法咒语", file: "chapter4.md" },
                        { id: 5, title: "第五章：遇见新朋友", file: "chapter5.md" }
                    ];
                    
                    renderChapterList();
                    loadChapter(0);
                });
        }
        
        // 加载章节内容
        function loadChapter(index) {
            if (index < 0 || index >= chapters.length) return;
            
            // 更新当前章节索引
            currentChapterIndex = index;
            
            // 更新章节标题
            chapterTitle.textContent = chapters[index].title;
            
            // 显示加载状态
            readingArea.innerHTML = `
                <div class="flex justify-center items-center h-64">
                    <i class="fa fa-spinner fa-spin text-primary"></i>
                    <span class="ml-2">加载中...</span>
                </div>
            `;
            
            // 使用配置的URL请求章节文件
            const filePath = getFileUrl(chapters[index].file);
            
            fetch(filePath)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`无法加载章节文件: ${response.status}`);
                    }
                    return response.text();
                })
                .then(content => {
                    // 使用marked库将Markdown转换为HTML
                    readingArea.innerHTML = marked.parse(content);
                    
                    // 更新章节列表选中状态
                    renderChapterList();
                    
                    // 更新导航按钮状态
                    updateNavButtons();
                    
                    // 滚动到顶部
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                })
                .catch(error => {
                    console.error('加载章节内容时出错:', error);
                    
                    // 显示错误信息
                    readingArea.innerHTML = `
                        <div class="flex flex-col justify-center items-center h-64 text-red-500">
                            <i class="fa fa-exclamation-circle text-4xl mb-3"></i>
                            <p>无法加载章节内容</p>
                            <p class="text-sm mt-2">文件路径: ${filePath}</p>
                            <p class="text-sm mt-1">错误: ${error.message}</p>
                        </div>
                    `;
                });
        }
        
        // 更新导航按钮状态
        function updateNavButtons() {
            // 上一章按钮
            if (currentChapterIndex <= 0) {
                prevChapter.disabled = true;
                prevChapterBottom.disabled = true;
                if (prevChapterMobile) prevChapterMobile.disabled = true;
            } else {
                prevChapter.disabled = false;
                prevChapterBottom.disabled = false;
                if (prevChapterMobile) prevChapterMobile.disabled = false;
            }

            // 下一章按钮
            if (currentChapterIndex >= chapters.length - 1) {
                nextChapter.disabled = true;
                nextChapterBottom.disabled = true;
                if (nextChapterMobile) nextChapterMobile.disabled = true;
            } else {
                nextChapter.disabled = false;
                nextChapterBottom.disabled = false;
                if (nextChapterMobile) nextChapterMobile.disabled = false;
            }
        }
        
        // 绑定事件监听
        function bindEvents() {
            // 侧边栏切换
            sidebarToggle.addEventListener('click', () => {
                mainSidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            });
            
            // 点击遮罩层关闭侧边栏
            overlay.addEventListener('click', () => {
                mainSidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            });

            // 移动端汉堡按钮 → 打开侧边栏
            if (sidebarToggleMobile) {
                sidebarToggleMobile.addEventListener('click', () => {
                    mainSidebar.classList.remove('-translate-x-full');
                    sidebarOverlay.classList.remove('hidden');
                });
            }

            // 移动端侧边栏内关闭按钮
            if (sidebarCloseMobile) {
                sidebarCloseMobile.addEventListener('click', () => {
                    mainSidebar.classList.add('-translate-x-full');
                    sidebarOverlay.classList.add('hidden');
                });
            }

            // 移动端遮罩层 → 关闭侧边栏
            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', () => {
                    mainSidebar.classList.add('-translate-x-full');
                    sidebarOverlay.classList.add('hidden');
                });
            }

            // 章节侧边栏切换
            chapterToggle.addEventListener('click', () => {
                chapterSidebar.classList.add('active');
                chapterOverlay.classList.remove('hidden');
            });

            chapterToggleBottom.addEventListener('click', () => {
                chapterSidebar.classList.add('active');
                chapterOverlay.classList.remove('hidden');
            });

            closeChapter.addEventListener('click', () => {
                chapterSidebar.classList.remove('active');
                chapterOverlay.classList.add('hidden');
            });

            // 点击遮罩层关闭章节侧边栏
            chapterOverlay.addEventListener('click', () => {
                chapterSidebar.classList.remove('active');
                chapterOverlay.classList.add('hidden');
            });
            
            // 点击阅读区域中间位置打开章节列表
            readingArea.addEventListener('click', (e) => {
                // 检查点击位置是否在阅读区域中间
                const rect = readingArea.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const clickX = e.clientX;
                const clickY = e.clientY;
                
                // 如果点击位置在中心区域（100px范围内）
                if (Math.abs(clickX - centerX) < 100 && Math.abs(clickY - centerY) < 100) {
                    chapterSidebar.classList.toggle('active');
                    chapterOverlay.classList.toggle('hidden');
                }
            });
            
            // 章节导航
            prevChapter.addEventListener('click', () => {
                if (currentChapterIndex > 0) {
                    loadChapter(currentChapterIndex - 1);
                }
            });
            
            nextChapter.addEventListener('click', () => {
                if (currentChapterIndex < chapters.length - 1) {
                    loadChapter(currentChapterIndex + 1);
                }
            });
            
            prevChapterBottom.addEventListener('click', () => {
                if (currentChapterIndex > 0) {
                    loadChapter(currentChapterIndex - 1);
                }
            });
            
            nextChapterBottom.addEventListener('click', () => {
                if (currentChapterIndex < chapters.length - 1) {
                    loadChapter(currentChapterIndex + 1);
                }
            });

            // 移动端章节导航
            if (prevChapterMobile) {
                prevChapterMobile.addEventListener('click', () => {
                    if (currentChapterIndex > 0) {
                        loadChapter(currentChapterIndex - 1);
                    }
                });
            }
            if (nextChapterMobile) {
                nextChapterMobile.addEventListener('click', () => {
                    if (currentChapterIndex < chapters.length - 1) {
                        loadChapter(currentChapterIndex + 1);
                    }
                });
            }
            if (chapterToggleMobile) {
                chapterToggleMobile.addEventListener('click', () => {
                    chapterSidebar.classList.add('active');
                    chapterOverlay.classList.remove('hidden');
                });
            }

            // 排序方式切换
            orderAsc.addEventListener('click', () => {
                sortOrder = 'asc';
                orderAsc.classList.add('text-primary');
                orderAsc.classList.remove('text-dark');
                orderDesc.classList.add('text-dark');
                orderDesc.classList.remove('text-primary');
                renderChapterList();
            });
            
            orderDesc.addEventListener('click', () => {
                sortOrder = 'desc';
                orderDesc.classList.add('text-primary');
                orderDesc.classList.remove('text-dark');
                orderAsc.classList.add('text-dark');
                orderAsc.classList.remove('text-primary');
                renderChapterList();
            });
            
            // 字体大小调节
            fontSmaller.addEventListener('click', () => {
                if (fontSize > 70) {
                    fontSize -= 10;
                    updateFontSize();
                    saveSettings();
                }
            });
            
            fontLarger.addEventListener('click', () => {
                if (fontSize < 150) {
                    fontSize += 10;
                    updateFontSize();
                    saveSettings();
                }
            });
            
            // 主题切换
            themeDay.addEventListener('click', () => {
                setTheme('day');
                saveSettings();
            });
            
            themeEye.addEventListener('click', () => {
                setTheme('eye');
                saveSettings();
            });
            
            themeNight.addEventListener('click', () => {
                setTheme('night');
                saveSettings();
            });
        }
        
        // 更新字体大小
        function updateFontSize() {
            readingArea.style.fontSize = `${fontSize}%`;
        }
        
        // 主题颜色映射（备用，确保切换一定生效）
        const themeColors = {
            day:   { bg: '#ffffff', text: '#333333' },
            eye:   { bg: '#eaf5e9', text: '#2d4829' },
            night: { bg: '#2c3e50', text: '#ecf0f1' }
        };

        // 设置主题
        function setTheme(theme) {
            // 移除所有主题类
            document.body.classList.remove('bg-day-bg', 'text-day-text');
            document.body.classList.remove('bg-eye-bg', 'text-eye-text');
            document.body.classList.remove('bg-night-bg', 'text-night-text');

            // 添加当前主题类（依赖 Tailind CDN 生成）
            document.body.classList.add(`bg-${theme}-bg`, `text-${theme}-text`);

            // 同时用 inline style 设置颜色（备用方案，确保一定生效）
            if (themeColors[theme]) {
                document.body.style.backgroundColor = themeColors[theme].bg;
                document.body.style.color = themeColors[theme].text;
            }

            // 更新按钮激活态
            themeDay.classList.remove('active');
            themeEye.classList.remove('active');
            themeNight.classList.remove('active');
            if (theme === 'day') {
                themeDay.classList.add('active');
            } else if (theme === 'eye') {
                themeEye.classList.add('active');
            } else if (theme === 'night') {
                themeNight.classList.add('active');
            }
        }
        
        // 保存设置到本地存储
        function saveSettings() {
            const settings = {
                theme: document.body.classList.contains('bg-day-bg') ? 'day' : 
                       document.body.classList.contains('bg-eye-bg') ? 'eye' : 'night',
                fontSize: fontSize,
                sortOrder: sortOrder
            };
            
            localStorage.setItem('readingSettings', JSON.stringify(settings));
        }
        
        // 从本地存储加载设置
        function loadSettings() {
            const savedSettings = localStorage.getItem('readingSettings');
            if (savedSettings) {
                const settings = JSON.parse(savedSettings);
                
                // 应用主题设置
                setTheme(settings.theme);
                
                // 应用字体大小设置
                fontSize = settings.fontSize;
                updateFontSize();
                
                // 应用排序设置
                sortOrder = settings.sortOrder;
                if (sortOrder === 'asc') {
                    orderAsc.classList.add('text-primary');
                    orderAsc.classList.remove('text-dark');
                    orderDesc.classList.add('text-dark');
                    orderDesc.classList.remove('text-primary');
                } else {
                    orderDesc.classList.add('text-primary');
                    orderDesc.classList.remove('text-dark');
                    orderAsc.classList.add('text-dark');
                    orderAsc.classList.remove('text-primary');
                }
            }
        }
    </script>
</body>
</html>
