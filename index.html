                        light: '#F5F5F0',
                        dark: '#585858'
                    },

    <style>
        /* ========== 全局 ========== */
        * { box-sizing: border-box; }

        body {
            background-color: #91A3B0;
            background-image: 
                radial-gradient(#ffffff22 5px, transparent 5px),
                radial-gradient(#ffffff22 5px, transparent 5px);
            background-size: 48px 48px;
            background-position: 0 0, 24px 24px;
            overflow-x: hidden;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        body.loaded { opacity: 1; }

        /* ========== 页面加载遮罩 ========== */
        #page-loader {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #b8ccd6 0%, #c9d8bf 50%, #dfc4c1 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #page-loader.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader-paw {
            font-size: 2.8rem;
            animation: pawBounce 1.2s ease-in-out infinite;
        }

        .loader-text {
            color: #fff;
            font-size: 1rem;
            letter-spacing: 0.15em;
            animation: fadeInOut 1.2s ease-in-out infinite;
        }

        .loader-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            margin: 0 4px;
            animation: dotBounce 1.2s ease-in-out infinite;
        }
        .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loader-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pawBounce {
            0%, 100% { transform: scale(1) rotate(-5deg); }
            50% { transform: scale(1.2) rotate(5deg); }
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        @keyframes dotBounce {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-6px); opacity: 1; }
        }

        /* ========== 粒子背景画布 ========== */
        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ========== 浮动光晕装饰 ========== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 8s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 340px; height: 340px;
            background: radial-gradient(circle, #C9A9A6, transparent 70%);
            top: -80px; right: -60px;
            animation-duration: 9s;
        }
        .orb-2 {
            width: 260px; height: 260px;
            background: radial-gradient(circle, #A3B18A, transparent 70%);
            bottom: 10%; left: -60px;
            animation-duration: 11s;
            animation-delay: 2s;
        }
        .orb-3 {
            width: 200px; height: 200px;
            background: radial-gradient(circle, #D4A373, transparent 70%);
            bottom: 30%; right: 10%;
            animation-duration: 13s;
            animation-delay: 4s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(20px, 30px) scale(1.08); }
        }

        /* ========== 侧边栏（桌面端默认显示） ========== */
        .sidebar {
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
            transform: translateX(-100%);
        }
        @media (min-width: 768px) {
            .sidebar { transform: translateX(0); }
        }
        .sidebar.sidebar-open {
            transform: translateX(0) !important;
        }

        /* ========== 音乐按钮 ========== */
        .music-btn { transition: all 0.3s ease; }
        .music-btn:hover { transform: scale(1.12) rotate(10deg); }

        /* 音符脉动圈 */
        .music-pulse {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid rgba(145,163,176,0.5);
            animation: pulse-ring 2s ease-out infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* ========== 社交图标 ========== */
        .social-icon {
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        .social-icon:hover {
            transform: translateY(-4px) scale(1.15);
            box-shadow: 0 8px 20px rgba(0,0,0,0.18);
        }

        /* ========== 个人信息卡片 ========== */
        .profile-card {
            transition: all 0.5s cubic-bezier(0.23,1,0.32,1);
            transform-origin: center;
        }
        .profile-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 48px rgba(0,0,0,0.12);
        }

        /* ========== 头像区 ========== */
        .avatar-wrap {
            position: relative;
            width: 192px;
            height: 192px;
            margin: auto;
        }

        /* 双层旋转光环 */
        .avatar-ring-outer {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: conic-gradient(
                #C9A9A6, #A3B18A, #91A3B0, #D4A373, #C9A9A6
            );
            animation: ringRotate 6s linear infinite;
            opacity: 0.75;
        }
        .avatar-ring-outer::before {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: #d6e0e7;
        }

        .avatar-ring-inner {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: conic-gradient(
                #A3B18A, #C9A9A6, #D4A373, #91A3B0, #A3B18A
            );
            animation: ringRotate 4s linear infinite reverse;
            opacity: 0.5;
        }
        .avatar-ring-inner::before {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: #d6e0e7;
        }

        @keyframes ringRotate { to { transform: rotate(360deg); } }

        /* 头像光晕 */
        .avatar-glow {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background: radial-gradient(circle at 50%, #C9A9A655, #A3B18A33, transparent 70%);
            animation: glowPulse 3s ease-in-out infinite alternate;
        }
        @keyframes glowPulse {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        .avatar-img {
            position: relative;
            z-index: 10;
            width: 192px;
            height: 192px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        .avatar-wrap:hover .avatar-img {
            transform: scale(1.05);
        }

        /* ========== 板块卡片 ========== */
        .section-card {
            transition: all 0.4s cubic-bezier(0.23,1,0.32,1);
            position: relative;
            overflow: hidden;
        }
        .section-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .section-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.13);
        }
        .section-card:hover::after { opacity: 1; }

        /* 卡片顶部图标区光效 */
        .card-icon-area {
            position: relative;
            overflow: hidden;
        }
        .card-icon-area::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 60% 40%, rgba(255,255,255,0.3), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .section-card:hover .card-icon-area::before { opacity: 1; }

        .card-icon {
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        .section-card:hover .card-icon { transform: scale(1.2) rotate(-5deg); }

        /* ========== 标题区入场动画 ========== */
        .fade-in-up {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ========== 标题装饰 ========== */
        .section-title {
            position: relative;
            display: inline-block;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 3px;
            border-radius: 2px;
            background: linear-gradient(90deg, #C9A9A6, #A3B18A);
            opacity: 0.8;
        }

        /* ========== 闪烁星星装饰 ========== */
        .star {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255,255,255,0.85);
            pointer-events: none;
            z-index: 1;
            animation: starTwinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
        }
        @keyframes starTwinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* 星星扩散动画 */
        .star-burst {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.95);
            pointer-events: none;
            z-index: 100;
            animation: starBurst 1.2s ease-out forwards;
        }
        @keyframes starBurst {
            0% {
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(255,255,255,0.7), 0 0 8px 2px rgba(255,255,255,0.3);
            }
            50% {
                opacity: 0.7;
                box-shadow: 0 0 0 20px rgba(255,255,255,0.3), 0 0 30px 10px rgba(200,220,255,0.2);
            }
            100% {
                transform: scale(4);
                opacity: 0;
                box-shadow: 0 0 0 60px rgba(255,255,255,0), 0 0 80px 30px rgba(200,220,255,0);
            }
        }

        /* ========== 页脚 ========== */
        footer {
            position: relative;
            z-index: 10;
        }

        /* ========== 内容层级 ========== */
        main, header, footer, .sidebar, #music-control {
            position: relative;
            z-index: 10;
        }
    </style>
</head>

    <script>
    // ========== 页面加载动画 ==========
    window.addEventListener('load', () => {
        const loader = document.getElementById('page-loader');
        setTimeout(() => {
            loader.classList.add('hide');
            document.body.classList.add('loaded');
            // 触发入场动画
            triggerFadeIn();
        }, 900);
    });

    // ========== 入场动画（Intersection Observer） ==========
    function triggerFadeIn() {
        const els = document.querySelectorAll('.fade-in-up');
        // 立即显示视口内的元素
        els.forEach(el => {
            const rect = el.getBoundingClientRect();
            if (rect.top < window.innerHeight) {
                setTimeout(() => el.classList.add('visible'), 
                    parseFloat(el.style.transitionDelay || '0') * 1000);
            }
        });
        // 滚动时触发
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const delay = parseFloat(entry.target.style.transitionDelay || '0') * 1000;
                    setTimeout(() => entry.target.classList.add('visible'), delay);
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.12 });
        els.forEach(el => observer.observe(el));
    }

    // ========== 粒子背景 ==========
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const COLORS = ['rgba(201,169,166,VAL)', 'rgba(163,177,138,VAL)', 'rgba(145,163,176,VAL)', 'rgba(212,163,115,VAL)'];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Particle {
        constructor() { this.reset(true); }
        reset(init) {
            this.x = Math.random() * canvas.width;
            this.y = init ? Math.random() * canvas.height : canvas.height + 10;
            this.r = Math.random() * 3 + 1;
            this.color = COLORS[Math.floor(Math.random() * COLORS.length)].replace('VAL', (Math.random() * 0.4 + 0.2).toFixed(2));
            this.speed = Math.random() * 0.4 + 0.15;
            this.drift = (Math.random() - 0.5) * 0.3;
            this.life = 0;
            this.maxLife = Math.random() * 200 + 150;
        }
        update() {
            this.y -= this.speed;
            this.x += this.drift;
            this.life++;
            if (this.life > this.maxLife || this.y < -10) this.reset(false);
        }
        draw() {
            const progress = this.life / this.maxLife;
            const alpha = progress < 0.1 ? progress * 10 : progress > 0.8 ? (1 - progress) * 5 : 1;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.globalAlpha = alpha * 0.7;
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    for (let i = 0; i < 55; i++) particles.push(new Particle());

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ========== 随机闪烁小星星 ==========
    function createStar() {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.setProperty('--dur', (Math.random() * 3 + 2) + 's');
        star.style.setProperty('--delay', '-' + (Math.random() * 5) + 's');
        star.style.width = star.style.height = (Math.random() * 3 + 2) + 'px';
        document.body.appendChild(star);
    }
    for (let i = 0; i < 30; i++) createStar();

    // ========== 星星扩散动效（10秒最多1个） ==========
    let burstTimeout;
    function scheduleBurst() {
        // 随机等待 8~12 秒
        const delay = 8000 + Math.random() * 4000;
        burstTimeout = setTimeout(() => {
            triggerStarBurst();
            scheduleBurst();
        }, delay);
    }

    function triggerStarBurst() {
        const stars = document.querySelectorAll('.star');
        if (stars.length === 0) return;

        // 随机选一个在可视范围内的星星
        const visibleStars = Array.from(stars).filter(star => {
            const rect = star.getBoundingClientRect();
            return rect.top >= 0 && rect.bottom <= window.innerHeight &&
                   rect.left >= 0 && rect.right <= window.innerWidth;
        });

        if (visibleStars.length === 0) return;

        const targetStar = visibleStars[Math.floor(Math.random() * visibleStars.length)];
        const rect = targetStar.getBoundingClientRect();

        // 创建扩散元素
        const burst = document.createElement('div');
        burst.className = 'star-burst';
        burst.style.left = rect.left + rect.width / 2 + 'px';
        burst.style.top = rect.top + rect.height / 2 + 'px';
        burst.style.width = rect.width + 'px';
        burst.style.height = rect.height + 'px';
        document.body.appendChild(burst);

        // 动画结束后移除
        setTimeout(() => burst.remove(), 800);
    }

    scheduleBurst();

    // 页面隐藏时暂停，节省性能
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            clearTimeout(burstTimeout);
        } else {
            scheduleBurst();
        }
    });

    // ========== 音乐控制 ==========
    const musicControl = document.getElementById('music-control');
    const backgroundMusic = document.getElementById('background-music');
    const musicIcon = document.getElementById('music-icon');
    const musicPulse = document.querySelector('.music-pulse');

    function setPlaying(playing) {
        if (playing) {
            musicIcon.className = 'fa fa-pause text-primary text-xl relative z-10';
            musicPulse.style.animation = 'pulse-ring 2s ease-out infinite';
        } else {
            musicIcon.className = 'fa fa-play text-primary text-xl relative z-10';
            musicPulse.style.animation = 'none';
        }
    }

    backgroundMusic.play().catch(() => setPlaying(false));
    backgroundMusic.addEventListener('play', () => setPlaying(true));
    backgroundMusic.addEventListener('pause', () => setPlaying(false));

    musicControl.addEventListener('click', () => {
        backgroundMusic.paused ? backgroundMusic.play() : backgroundMusic.pause();
    });

    // ========== 侧边栏移动端 ==========
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');

    // 检测侧边栏是否打开（兼容 CSS 与 style 两种设置方式）
    function isSidebarOpen() {
        if (sidebar.classList.contains('sidebar-open')) return true;
        if (sidebar.style.transform === 'translateX(0px)' || sidebar.style.transform === 'translateX(0)') return true;
        return sidebar.getBoundingClientRect().left === 0;
    }

    // 打开侧边栏
    function openSidebar() {
        sidebar.classList.add('sidebar-open');
        sidebar.style.transform = 'translateX(0)';
        if (sidebarOverlay) {
            sidebarOverlay.classList.remove('hidden');
        }
        if (window.innerWidth < 768) {
            document.body.style.overflow = 'hidden';
        }
    }

    // 关闭侧边栏
    function closeSidebar() {
        sidebar.classList.remove('sidebar-open');
        sidebar.style.transform = 'translateX(-100%)';
        if (sidebarOverlay) {
            sidebarOverlay.classList.add('hidden');
        }
        document.body.style.overflow = '';
    }

    // 移动端点击覆盖层关闭侧边栏
    if (sidebarOverlay) {
        sidebarOverlay.addEventListener('click', closeSidebar);
    }

    // 移动端点击空白处关闭侧边栏
    document.addEventListener('click', (e) => {
        if (window.innerWidth < 768 && isSidebarOpen() &&
            !sidebar.contains(e.target) &&
            !document.getElementById('mobile-menu-toggle')?.contains(e.target)) {
            closeSidebar();
        }
    });

    // 桌面端 hover 显示侧边栏
    const desktopMedia = window.matchMedia('(min-width: 768px)');
    if (desktopMedia.matches) {
        sidebar.addEventListener('mouseenter', () => {
            sidebar.style.transform = 'translateX(0)';
        });
        sidebar.addEventListener('mouseleave', () => {
            sidebar.style.transform = 'translateX(0)';
        });
    }
    desktopMedia.addEventListener('change', (e) => {
        if (e.matches) {
            sidebar.style.transform = 'translateX(0)';
        } else {
            closeSidebar();
        }
    });

    // 移动端汉堡菜单按钮
    function createMobileMenuToggle() {
        const existing = document.getElementById('mobile-menu-toggle');
        if (existing) existing.remove();

        if (window.innerWidth < 768) {
            const menuToggle = document.createElement('div');
            menuToggle.id = 'mobile-menu-toggle';
            menuToggle.className = 'fixed top-6 left-6 z-[60] bg-white bg-opacity-90 p-3 rounded-full shadow-lg cursor-pointer w-12 h-12 flex items-center justify-center';
            menuToggle.innerHTML = '<i class="fa fa-bars text-primary"></i>';
            document.body.appendChild(menuToggle);
            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isSidebarOpen()) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            });
        }
    }
    createMobileMenuToggle();

    // 窗口大小变化时重新检查
    window.addEventListener('resize', createMobileMenuToggle);
    </script>
</body>
</html>
